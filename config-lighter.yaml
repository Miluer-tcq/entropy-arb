# entropy-arb strategy configuration / 策略配置
#
#   cp config.example.yaml config.yaml     then edit / 复制后修改
#
# This file IS the strategy. Credentials never live here — they go in .env
# (see .env.example). Every key is validated: a typo is a startup error, not
# a setting that silently does nothing.
# 本文件就是策略本身。密钥绝不放在这里（见 .env.example）。所有键名都会被校验：
# 拼写错误会直接报错，而不是静默失效。
#
# WHICH MARKETS to trade is NOT in this file — you state it explicitly on
# every start with command-line flags:
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy is always one leg; --hedge picks the other:
#   lighter      Lighter mainnet            (USDC, 0 bps taker)
#   lighter-rh   Lighter Robinhood chain    (USDG, 0 bps taker)
#   tradexyz     Hyperliquid trade.xyz dex  (USDC, ~1 bps taker)
# 交易哪个市场不在本文件中配置——每次启动时用命令行参数显式指定：
#     python3 main.py --symbol SNDK --hedge lighter-rh
# Entropy 永远是其中一条腿；--hedge 选择对冲腿（三选一，见上表）。

# ============================ THE SIGNAL / 信号 ============================
# premium_bps = (Entropy price / hedge price - 1) * 10000
#
#   SELL entropy + BUY hedge   when executable premium >= midline + upper
#   BUY entropy + SELL hedge   when executable premium <= midline - lower
#
# Both hurdles are net of taker fees (the engine adds fees on top), so one
# full round trip nets >= upper + lower bps after fees by construction.
#
# midline_bps is a number YOU derive from recorded data. Run the bot
# (--record-only) to collect logs/minutes.csv, then:  python3 tools/analyze.py
#
# midline_bps 是你根据采集数据设定的值。先运行机器人（--record-only）采集
# logs/minutes.csv，再运行 python3 tools/analyze.py 获取建议值。
# 两个方向的门槛都已扣除手续费（引擎会在此之上另加手续费），因此一次完整往返
# 扣费后净赚 >= upper + lower bps。
#
# by_session：美股常规时段（含双边扰动）噪声约为盘外的 1.3 倍、中枢整体下移
# 约 1.5 bps，因此盘中用独立中枢+更宽带；窗口外（含周末休市）用全局带。
thresholds:
  midline_bps: -5.0    # 锚点: auto_midline 在锚点±clamp 内自由跟随;跳变超出时手动挪这里
  auto_midline: true
  auto_midline_clamp_bps: 5.0   # 允许范围 [-11.8, -1.8],覆盖 08-30/31 两天全部实测 regime
  # 带宽自动化:同一稳定窗内取"该方向 p90 可执行肉量"作为实时带宽(与 analyze 建议同源)。
  # 上/下限夹取 [2.5, 8.0]:低于地板不配开火(1.8bps 回合费+薄边),高于天花板不如歇着。
  # 开启后 windows 里的 upper/lower 只作冷启动种子,实盘带以 auto 为准;跳变期同样冻结。
  auto_band: true
  auto_band_trigger_pct: 10.0   # 每方向 ~10% 分钟触发(对齐 analyze 的建议口径)
  auto_band_floor_bps: 2.5
  auto_band_ceiling_bps: 8.0
  # 冻结保险(tuner 全程稳定裁决,漂移期冻结):
  #  1) 冻结期间测 1h 漂移方向,锁死逆漂移的"开新仓"(平旧仓永远放行);
  #  2) 冻结超过 N 分钟 → 改用最近 60 分钟数据重锚 midline/带宽,不再抱着过时种子。
  auto_frozen_fallback_min: 30
  # 执行硬地板:任何一腿计划扣费后的净期望边 < 名义×此bps 一律不开火。
  # 08-31 实证:漂移期 tuner 冻结 + 旧锚点曾让 24 笔负边 sell 开火,fill 合计 -$0.47;
  # 回放显示仅此一闸即可把两天 fill 净额从 -$0.09 翻正到 +$0.42(只砍负边,好单不误伤)。
  # 注意:地板只管开新仓——平掉已有持仓永远放行(09-01 教训:地板卡死 0.0193 多单数小时)。
  min_net_edge_bps: 2.5
  # 幻象天花板:顶部可执行价差 > 此bps 的"机会"直接跳过。09-01 实证:
  # 所有 >=19bps 信号全部一条腿 canceled(单边裸仓+白付 hedge),18bps 以内才有双边成交。
  max_top_premium_bps: 18
  # Maker 阶梯(天花板拦住的大价差不再浪费):把想成交的那条腿(永远是熵腿)
  # 以 GTC 被动单挂在过时报价上"等回踩"——真错位则成交并免taker费,跳价假象则永不
  # 成交、超时撤单零成本;成交之后才 taker 补对冲腿,不存在裸腿窗口。
  # 进程退出/shutdown 自动撤销所有挂单(cancel_resting),不留孤儿单过夜。
  maker_enabled: true
  maker_wait_sec: 3.0
  # auto_midline_hours 不填 = 自适应:从 2/4/6/12/24h 里选最短且内部中位数稳定的窗口;
  # 所有候选窗都不稳定(= 正在 regime 跳变)→ 冻结不追,新 regime 攒够 20 分钟自动整体吸附
  upper_bps: 4.0       # 全局带 = 隔夜段(ET 20:00-04:00):σ2.41,卖侧 p90 仅 +0.2 → 上下 4.0
  lower_bps: 4.0
  # 五段分档(08-31 用 88h+ 数据实测,美东时段;时间均为 UTC 夏令时换算,
  # 11-01 美国进入冬令时后下列窗口整体 +1h):
  #   时段          σ     买边p90  卖边p90  → 带宽取 ~1.5-1.7×σ;卖边无肉的时段把 upper 拉宽"禁用"
  windows:
    - name: weekend
      all_day: true
      days: [5, 6]
      upper_bps: 8.0   # 卖边 p90=-0.7 → 实际禁用卖
      lower_bps: 3.5   # 买边 p90=6.9,σ1.98
    - name: regular
      start_utc: "13:30"   # ET 09:30 开盘
      end_utc: "20:00"     # ET 16:00 收盘
      days: [0, 1, 2, 3, 4]
      upper_bps: 5.5   # σ3.30,机会强度全场最高(买p50 已到 10bps);地板/带宽兜底,无需拉宽
      lower_bps: 5.5
    - name: premarket
      start_utc: "08:00"   # ET 04:00
      end_utc: "13:30"     # ET 09:30
      days: [0, 1, 2, 3, 4]
      upper_bps: 4.5   # 卖边偶有肉(p99 6.2),样本小先对称微收
      lower_bps: 4.5
    - name: postmarket
      start_utc: "20:00"   # ET 16:00
      end_utc: "00:00"     # ET 20:00(跨午夜由 wrap 规则处理)
      days: [0, 1, 2, 3, 4]
      upper_bps: 8.0   # 卖边 p90=-1.4 → 禁用卖
      lower_bps: 4.5   # σ3.18,买边 p90 13.1 仍活跃

# ======================== VENUES / 交易所参数 ==============================
entropy:
  dex: io                    # Entropy's dex name on Hyperliquid / Entropy 的 dex 名
  taker_fee_bps: 0.9         # 实测 fills API: 0.86 bps/笔(taker 9bps × growth-mode 0.1),保守取 0.9
                             # “100%返佣”不存在:self-rebate=60%×Entropy 分成的一半,已在成交价外另结
  fee_auto: false            # 手动实测值;自动发现会读到 4.5bps 基础费率(不含 growth-mode 折扣)
  leverage: 3                # 3x=强平线~33%: 单一股票perp隔夜安全的最后一档,勿再上
  max_position_usd: 30       # 3x 下 $30 名义占 $10 保证金 ≈ 82% 权益;要更多利用率→加本金,别加杠杆
  max_orders_per_min: 120    # order-send budget, sliding 60s / 每分钟下单预算

hedge:
  taker_fee_bps: 0.0         # Lighter venues: 0; tradexyz: ~1.0
  fee_auto: false            # Lighter 本就 0 费；禁用自动发现保持 0
  max_position_usd: 30       # 网页已调逐仓3x,与HL对称(强平线同~33%);单边强平由引擎delta自动补平
  max_orders_per_min: 35     # Lighter's ceiling is ~40/min / Lighter 上限约 40/分钟

# ========================= SIZING / 下单规模 ===============================
sizing:
  take_fraction: 0.5           # fraction of crossable depth to take / 吃掉可套利深度的比例
                               # 0.9 时要求门槛内深度>=$11.1;薄盘口下全吃 $10 起跳
  max_order_notional_usd: 30   # per-slice cap / 单笔名义上限（= 交易所最小单）
  min_order_notional_usd: 10   # skip dust / 低于此名义不下单

# ==================== INVENTORY LADDER / 库存阶梯 ==========================
# Extra bps required once a venue's position passes floor_frac of its cap in
# the adding direction — ramps linearly to scale_bps at 100% of the cap.
# Slows down one-sided accumulation without hard-stopping the strategy.
# 当某交易所持仓超过上限的 floor_frac 后，同方向继续加仓需额外溢价，线性增加到
# 满仓时的 scale_bps。避免单边持仓快速堆满。 scale_bps: 0 disables / 0 为关闭。
# 08-31: floor 0 → 0.8。原 0 从第1美元就收"保护费"，$15 仓位即要求 +5bps，
# 把 7-8bps 的边早早掐死 → 资金利用率减半。0.8 = 前 $24 全额效率，最后20%才抬门槛。
inventory:
  scale_bps: 0
  floor_frac: 0.8

# ======================= EXECUTION / 执行参数 ==============================
execution:
  premium_persist_sec: 1.2     # edge must persist this long before firing / 信号需持续时间
                               # 0.3s 实测放进"HL急动+Lighter滞后"的幻象价差(36笔 exp+0.56/fill-0.12)
                               # 08-31 复盘:0.3s 下赢家 exp->fill 中位衰减 72%,1.2s 才滤得掉
  cooldown_sec: 0.0            # min gap between executions / 两次执行的最小间隔
  settle_timeout_sec: 10.0      # wait for fill confirmation / 等待成交确认
  leg_slippage_bps: 12.0       # taker limit protection per leg / 每腿滑点保护
                               # 50→12: 行情瞬时位移>12bps 时放弃追单(追=负edge),没位移的edge照样吃到
  hedge_slippage_bps: 20.0     # price protection on delta hedges / 对冲滑点保护
  net_tolerance_base: 0.001    # max tolerated net delta (base units) / 允许的净敞口
  max_consecutive_errors: 3    # halt after N straight failures / 连续失败 N 次后停机
  rate_limit_pause_sec: 10.0   # pause a 429'd venue this long / 被限频后的暂停时长
  staleness_sec: 10.0          # a feed older than this is stale / 行情超时判定
  reconcile_sec: 15.0          # on-chain position sync cadence / 链上持仓核对周期
  venue_probe_sec: 30.0        # probe cadence for a down venue / 故障交易所探测周期
  http_keepalive_sec: 10.0     # keep order-path TLS warm; 0 = off / 订单链路保活
  # ---- 09-01 复盘新增:风险与出场解耦 ----
  daily_max_loss_usd: 0.60     # UTC 日 PnL(实现+浮动,费用在内)跌破 -此值 → 全平+停机
                               # ≈ 双边权益 2.5%;断路器状态持久化,重启不重置当日计数
  reversion_close_bps: 1.0     # 持仓的 premium 回到 mid±1bps → 强制平仓不等对面带宽
                               # (09-01 教训:锚漂移后平仓阈值永远够不着,多单卡一整天)
  timeout_close_min: 240       # 持仓超 4h 同样触发强平窗口(净边>0 才成交,亏麻不割)
  min_cross_rounds: 2.0        # 可穿深度 < 2×最小单时拒绝开新仓(0.0066 尾巴单防抖)
                               # 注:平仓永不受此限,也不受 min_net_edge 地板限制

# ================== DATA RECORDER / 数据采集 ===============================
# Always-on while the bot runs: samples both real order books 1/sec and
# writes one CSV row per minute. This is the input for tools/analyze.py.
# 机器人运行期间自动开启：每秒采样两边真实盘口，每分钟写一行 CSV，
# 供 tools/analyze.py 分析并设定上方 thresholds。
recorder:
  enabled: true
  csv: logs/lighter_minutes.csv

# ==================== LOGGING & DASHBOARD / 日志与仪表盘 ====================
# On a terminal the bot shows a live Rich dashboard (books, signal, positions,
# PnL, recent executions); log lines then go to `file` instead of the console.
# Off-terminal runs (nohup/systemd) fall back to plain console logs
# automatically; --no-dashboard forces that.
# 在终端运行时显示实时 Rich 仪表盘（盘口、信号、持仓、盈亏、最近成交），
# 日志写入 `file` 而不再打印到屏幕。非终端环境（nohup/systemd）自动退回
# 纯日志模式；也可用 --no-dashboard 强制关闭。
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/lighter_trades.csv
  dashboard: true
  file: logs/lighter_engine.log

